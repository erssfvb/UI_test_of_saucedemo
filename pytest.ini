[pytest]
# ==================== 用例收集 ====================
# ↓ 这行是为了兼容现有文件名；等文件改名成 test_*.py 后就可以删掉。
python_files = test_*.py *_test.py Test*.py *Test.py

# 只在 tests/ 下找用例：不扫 page/ utils/，也不会碰根目录的 test.py
testpaths = tests

# ==================== 默认命令行参数 ====================
addopts =
    -v
    -ra
    --tb=short
    --durations=10
    --strict-markers
    --strict-config

# ==================== 自定义标记 ====================
markers =
    smoke: 冒烟用例，主流程，每次提交必跑
    regression: 回归用例，功能点与边界校验
    p0: 最高优先级
    p1: 中优先级
    p2: 低优先级

# ==================== 日志（你原来的配置，保留不动）====================
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = .reports/logs/pytest.log
log_file_level = INFO
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S